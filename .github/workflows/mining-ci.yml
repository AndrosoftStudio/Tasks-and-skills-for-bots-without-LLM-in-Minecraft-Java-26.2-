name: Mining CI

on:
  push:
    branches: [main]
    paths:
      - 'modules/mining/**'
      - '.github/workflows/mining-ci.yml'
  pull_request:
    paths:
      - 'modules/mining/**'
      - '.github/workflows/mining-ci.yml'

jobs:
  test-mining:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/mining
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modules/mining/package.json
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: TypeScript build
        run: npm run build
